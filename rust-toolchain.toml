# std on UEFI needs the unstable `uefi_std` gate (rust-lang/rust#100499).
# The pin matches the gobbl recovery application. The forms libraries stay on
# stable in their own repository.
[toolchain]
channel = "nightly-2026-08-08"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-unknown-uefi", "x86_64-unknown-uefi"]
